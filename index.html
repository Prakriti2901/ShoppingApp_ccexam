<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shopping App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Shopping App</h1>

  <div id="cart">
    🛒 Cart: <span id="cart-count">0</span> items | Total: $<span id="cart-total">0.00</span>
    <button id="checkout-btn">Checkout</button>
  </div>

  <div class="products">
    <div class="product" data-name="Product 1" data-price="10">
      <img src="https://via.placeholder.com/150" alt="Product 1">
      <h2>Product 1</h2>
      <p>$10.00</p>
      <button class="add-to-cart">Add to Cart</button>
    </div>

    <div class="product" data-name="Product 2" data-price="15">
      <img src="https://via.placeholder.com/150" alt="Product 2">
      <h2>Product 2</h2>
      <p>$15.00</p>
      <button class="add-to-cart">Add to Cart</button>
    </div>

    <div class="product" data-name="Product 3" data-price="20">
      <img src="https://via.placeholder.com/150" alt="Product 3">
      <h2>Product 3</h2>
      <p>$20.00</p>
      <button class="add-to-cart">Add to Cart</button>
    </div>
  </div>

  <div id="cart-items">
    <!-- Dynamically added cart items will appear here -->
  </div>

  <script src="script.js"></script>
</body>
</html>
